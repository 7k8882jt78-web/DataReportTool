name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name DataReportGUI --collect-all pandas --hidden-import openpyxl --hidden-import xlrd data_report_gui.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DataReportGUI-windows
          path: dist/DataReportGUI.exe
