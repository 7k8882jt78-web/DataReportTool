name: Build Windows EXE

on:
  push:
    branches: [ main ]  # 推送到 main 分支时自动触发
  workflow_dispatch:      # 也允许在 GitHub 页面上手动点击运行

jobs:
  build:
    runs-on: windows-latest  # 使用 GitHub 免费的 Windows 虚拟机[citation:2][citation:6]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 可以按需调整版本

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 使用 PyInstaller 打包
        run: |
          pyinstaller --onefile --windowed --name DataReportGUI ^
            --collect-all pandas ^
            --hidden-import openpyxl ^
            --hidden-import xlrd ^
            data_report_gui.py

      - name: 上传 exe 产物
        uses: actions/upload-artifact@v4
        with:
          name: DataReportGUI-windows
          path: dist/DataReportGUI.exe
          if-no-files-found: error